name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Clone if it's not there, otherwise just navigate into it
          if [ ! -d "~/2312284-devops-project" ]; then
            git clone https://github.com/Khushi-Kandhani/2312284-devops-project.git ~/2312284-devops-project
          fi
          cd ~/2312284-devops-project
          
          # 2. Pull the latest clean code from your main branch
          git pull origin main
          
          # 3. Securely build the production environment secrets file
          echo "POSTGRES_USER=${{ secrets.DB_USER }}" > .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.DB_NAME }}" >> .env
          
          # 4. Cycle the production docker container ecosystem using sudo privileges
          sudo docker compose -f docker-compose.prod.yml down
          sudo docker compose -f docker-compose.prod.yml up -d --build
