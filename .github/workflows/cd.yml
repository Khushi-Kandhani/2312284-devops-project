name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Force fix the Docker daemon socket permission block upfront
          sudo chmod 666 /var/run/docker.sock || true
          
          # 2. Check if the directory exists using explicit absolute paths
          if [ ! -d "/home/ubuntu/2312284-devops-project" ]; then
            git clone https://github.com/Khushi-Kandhani/2312284-devops-project.git /home/ubuntu/2312284-devops-project
          fi
          cd /home/ubuntu/2312284-devops-project

          # 3. Pull the latest clean code from your main branch
          git pull origin main

          # 4. Securely build the production environment secrets file
          echo "POSTGRES_USER=${{ secrets.DB_USER }}" > .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.DB_NAME }}" >> .env

          # 5. Cycle the production docker container ecosystem using sudo privileges
          sudo docker compose -f docker-compose.prod.yml down
          sudo docker compose -f docker-compose.prod.yml up -d --build
